name: Automated Multi-Cloud FinOps & IaC Policy Scan

on:
  push:
    branches: [ main ]
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate-governance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb

      - name: Run FinOps & Security Advisory Engine
        run: |
          python scripts/evaluate_governance.py

      - name: Commit and Push Updated Governance Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/governance_data.json data/governance_data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update IaC governance metrics & RAG executive brief [skip ci]" && git push)
